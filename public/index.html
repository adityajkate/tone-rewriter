<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Retone</title>
<link rel="stylesheet" href="styles.css" />
<script>
  // Apply the saved or system theme before paint to avoid a flash of light mode.
  try {
    var t = localStorage.getItem('theme')
    if (t === 'dark' || (!t && matchMedia('(prefers-color-scheme: dark)').matches)) {
      document.documentElement.dataset.theme = 'dark'
    }
  } catch (e) {}
</script>
</head>
<body>
  <button class="theme-toggle" type="button" aria-label="Toggle dark mode" title="Toggle dark mode">
    <svg class="icon-sun" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" aria-hidden="true">
      <circle cx="12" cy="12" r="4.5" />
      <path d="M12 1.5v3M12 19.5v3M1.5 12h3M19.5 12h3M4.6 4.6l2.1 2.1M17.3 17.3l2.1 2.1M19.4 4.6l-2.1 2.1M6.7 17.3l-2.1 2.1" />
    </svg>
    <svg class="icon-moon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M20.4 13.4A8.5 8.5 0 0 1 10.6 3.6a8.5 8.5 0 1 0 9.8 9.8Z" />
    </svg>
  </button>

  <div class="ambient" aria-hidden="true"></div>

  <main class="shell">

    <header class="reveal" style="--index: 0">
      <p class="eyebrow">Tone rewriter</p>
      <h1 class="hero">Same meaning.<br /><em>Different voice.</em></h1>
      <p class="standfirst">Paste a paragraph, pick how it should sound, and get it back rewritten. Your text is never stored.</p>
    </header>

    <hr class="rule" />

    <section class="card reveal" style="--index: 1">
      <div class="card__section">
        <label class="label" for="input">Your text</label>
        <textarea id="input" placeholder="An idea, an email, a message you are not happy with yet."></textarea>
      </div>

      <div class="card__section">
        <span class="label">Tone</span>
        <div class="tags" id="tones"></div>
        <label class="label is-hidden" for="custom">Custom tone</label>
        <input id="custom" type="text" placeholder="Or describe one: dry and technical, warm but brief, deadpan…" />
      </div>

      <div class="card__section actions">
        <p class="hint"><kbd>Ctrl</kbd> <kbd>Enter</kbd> to run</p>
        <button id="run" class="button" type="button">Rewrite</button>
      </div>

      <div class="card__section is-hidden" id="statusWrap">
        <p id="status"></p>
      </div>
    </section>

    <section class="card reveal is-hidden" id="resultWrap" style="--index: 2">
      <div class="card__section">
        <div class="result__head">
          <span class="label">Rewritten <span id="resultTone"></span></span>
          <button id="copy" class="ghost" type="button">
            <svg width="15" height="15" viewBox="0 0 256 256" fill="currentColor" aria-hidden="true">
              <path d="M216 32H88a8 8 0 0 0-8 8v40H40a8 8 0 0 0-8 8v128a8 8 0 0 0 8 8h128a8 8 0 0 0 8-8v-40h40a8 8 0 0 0 8-8V40a8 8 0 0 0-8-8m-56 176H48V96h112Zm48-48h-32V88a8 8 0 0 0-8-8H96V48h112Z" />
            </svg>
            <span id="copyLabel">Copy</span>
          </button>
        </div>
        <p id="output"></p>
      </div>
    </section>

  </main>

  <script src="app.js"></script>
</body>
</html>
